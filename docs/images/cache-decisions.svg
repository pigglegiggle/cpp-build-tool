<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">Action decision — content, not timestamps</text><rect x="30" y="175" width="230" height="90" fill="white" stroke="#222"/><text x="145.0" y="214.95" font-size="17" text-anchor="middle">Fingerprint inputs</text><text x="145.0" y="236.95" font-size="17" text-anchor="middle">Command + tools + env</text><rect x="350" y="80" width="270" height="80" fill="white" stroke="#222"/><text x="485.0" y="125.95" font-size="17" text-anchor="middle">Output + prior state match?</text><polyline points="260,220 305,220 305,120 350,120" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="930" y="80" width="240" height="80" fill="white" stroke="#222"/><text x="1050.0" y="125.95" font-size="17" text-anchor="middle">Reuse existing output</text><polyline points="620,120 930,120" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="770" y="103" font-size="15" text-anchor="middle">yes</text><rect x="350" y="275" width="270" height="80" fill="white" stroke="#222"/><text x="485.0" y="320.95" font-size="17" text-anchor="middle">Verified action cache hit?</text><polyline points="485,160 485,275" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="510" y="225" font-size="15" text-anchor="middle">no</text><rect x="930" y="275" width="240" height="80" fill="white" stroke="#222"/><text x="1050.0" y="320.95" font-size="17" text-anchor="middle">Restore cached artifact</text><polyline points="620,315 930,315" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="770" y="298" font-size="15" text-anchor="middle">yes</text><rect x="350" y="440" width="270" height="65" fill="white" stroke="#222"/><text x="485.0" y="478.45" font-size="17" text-anchor="middle">Run compiler / archiver / linker</text><polyline points="485,355 485,440" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="510" y="405" font-size="15" text-anchor="middle">no</text><rect x="930" y="430" width="240" height="85" fill="white" stroke="#222"/><text x="1050.0" y="457.1" font-size="16" text-anchor="middle">Recheck input content</text><text x="1050.0" y="478.1" font-size="16" text-anchor="middle">Atomically publish output</text><text x="1050.0" y="499.1" font-size="16" text-anchor="middle">Write cache + state</text><polyline points="620,472 930,472" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="600" y="550" font-size="16" text-anchor="middle">Fresh compiler scans also detect new headers earlier in an include search path.</text></g></svg>