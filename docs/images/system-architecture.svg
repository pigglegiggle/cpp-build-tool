<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">C++ Build Tool — build pipeline</text><rect x="30" y="150" width="200" height="80" fill="white" stroke="#222"/><text x="130.0" y="184.95" font-size="17" text-anchor="middle">Cppbuildfile</text><text x="130.0" y="206.95" font-size="17" text-anchor="middle">Targets + source files</text><rect x="320" y="150" width="220" height="80" fill="white" stroke="#222"/><text x="430.0" y="184.95" font-size="17" text-anchor="middle">Validated action DAG</text><text x="430.0" y="206.95" font-size="17" text-anchor="middle">Cycle detection</text><rect x="630" y="150" width="250" height="80" fill="white" stroke="#222"/><text x="755.0" y="184.95" font-size="17" text-anchor="middle">Bounded worker pool</text><text x="755.0" y="206.95" font-size="17" text-anchor="middle">Dependency-ready actions</text><rect x="970" y="150" width="200" height="80" fill="white" stroke="#222"/><text x="1070.0" y="185.1" font-size="16" text-anchor="middle">Clang / ar / linker</text><text x="1070.0" y="206.1" font-size="16" text-anchor="middle">Real subprocesses</text><polyline points="230,190 320,190" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="540,190 630,190" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="880,190 970,190" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="630" y="330" width="250" height="70" fill="white" stroke="#222"/><text x="755.0" y="360.1" font-size="16" text-anchor="middle">Verified local action cache</text><text x="755.0" y="381.1" font-size="16" text-anchor="middle">SHA-256 input keys</text><polyline points="755,230 755,330" fill="none" stroke="#222" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="970" y="330" width="200" height="70" fill="white" stroke="#222"/><text x="1070.0" y="360.25" font-size="15" text-anchor="middle">Managed outputs</text><text x="1070.0" y="380.25" font-size="15" text-anchor="middle">Objects · libraries · apps</text><polyline points="1070,230 1070,330" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="600" y="445" font-size="17" text-anchor="middle">Each compile action scans fresh compiler dependencies before deciding whether to rebuild.</text></g></svg>